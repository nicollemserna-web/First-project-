<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi vocabulario en inglés</title>
<style>
  body { font-family: sans-serif; background: #f4f1ec; margin: 0; padding: 20px; text-align: center; color: #333; }
  h1 { color: #2d6a4f; }
  p.tip { color: #777; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; max-width: 700px; margin: 0 auto; }
  .card { height: 120px; perspective: 800px; cursor: pointer; }
  .inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
  .card.flip .inner { transform: rotateY(180deg); }
  .side { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 14px; font-size: 22px; font-weight: bold; backface-visibility: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.15); }
  .front { background: #2d6a4f; color: white; }
  .back { background: white; color: #2d6a4f; transform: rotateY(180deg); }
</style>
</head>
<body>
<h1>Mi vocabulario en inglés</h1>
<p class="tip">Toca una tarjeta para ver su significado</p>
<div class="grid" id="grid"></div>

<script>
  // ✏️ Agrega o cambia tus palabras aquí: ["inglés", "español"],
  const words = [
    ["brave", "valiente"],
    ["grateful", "agradecido/a"],
    ["achieve", "lograr"],
    ["challenge", "reto"],
    ["growth", "crecimiento"],
  ];

  const grid = document.getElementById("grid");
  words.forEach(([en, es]) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<div class="inner"><div class="side front">${en}</div><div class="side back">${es}</div></div>`;
    card.onclick = () => card.classList.toggle("flip");
    grid.appendChild(card);
  });
</script>
</body>
</html>
